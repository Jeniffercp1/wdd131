<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product review form for WDD 131 with dynamic product options and accessible fields.">
  <meta name="author" content="Jeniffer Carrillo">
  <title>Product Review | WDD 131</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <span class="site-title">Product Review</span>
  </header>

  <main>
    <h1>Product Review</h1>

    <form method="get" action="review.html">
      <label for="product">Product Name <span class="required">*</span></label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Seleccione un producto...</option>
      </select>

      <fieldset>
        <legend>Overall Rating <span class="required">*</span></legend>
        <div class="rating-options">
          <label for="rating1">
            <span>1</span>
            <span aria-hidden="true">☆</span>
            <input type="radio" id="rating1" name="rating" value="1" required>
          </label>
          <label for="rating2">
            <span>2</span>
            <span aria-hidden="true">☆☆</span>
            <input type="radio" id="rating2" name="rating" value="2" required>
          </label>
          <label for="rating3">
            <span>3</span>
            <span aria-hidden="true">☆☆☆</span>
            <input type="radio" id="rating3" name="rating" value="3" required>
          </label>
          <label for="rating4">
            <span>4</span>
            <span aria-hidden="true">☆☆☆☆</span>
            <input type="radio" id="rating4" name="rating" value="4" required>
          </label>
          <label for="rating5">
            <span>5</span>
            <span aria-hidden="true">☆☆☆☆☆</span>
            <input type="radio" id="rating5" name="rating" value="5" required>
          </label>
        </div>
      </fieldset>

      <label for="install-date">Date of Installation <span class="required">*</span></label>
      <input type="date" id="install-date" name="install-date" required>

      <fieldset>
        <legend>Which features did you find useful?</legend>
        <div class="checkbox-group">
          <label for="durability">
            <input type="checkbox" id="durability" name="features" value="durability">
            Durability
          </label>
          <label for="ease-of-use">
            <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
            Ease of Use
          </label>
          <label for="performance">
            <input type="checkbox" id="performance" name="features" value="performance">
            Performance
          </label>
          <label for="design">
            <input type="checkbox" id="design" name="features" value="design">
            Design
          </label>
        </div>
      </fieldset>

      <label for="review">Written Review</label>
      <textarea id="review" name="review" rows="5" placeholder="Share what worked well or what could be improved."></textarea>

      <label for="username">Your Name</label>
      <input type="text" id="username" name="username" autocomplete="name">

      <input type="submit" value="Submit Review">
    </form>
  </main>

  <footer>
    <p>&copy;<span id="currentyear"></span> Jeniffer Carrillo, Ecuador</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
