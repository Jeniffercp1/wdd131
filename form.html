<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulario de reseña de productos para WDD 131 con opciones dinamicas y campos accesibles.">
  <meta name="author" content="Jeniffer Carrillo">
  <title>Reseña de Producto | WDD 131</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <span class="site-title">Reseña de Producto</span>
  </header>

  <main>
    <h1>Reseña de Producto</h1>

    <form method="get" action="review.html">
      <label for="product">Nombre del producto <span class="required">*</span></label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Seleccionar un producto...</option>
      </select>

      <fieldset>
        <legend>Calificación general <span class="required">*</span></legend>
        <div class="rating-options">
          <label for="rating1">
            <span>1</span>
            <span aria-hidden="true">☆</span>
            <input type="radio" id="rating1" name="rating" value="1" required>
          </label>
          <label for="rating2">
            <span>2</span>
            <span aria-hidden="true">☆☆</span>
            <input type="radio" id="rating2" name="rating" value="2" required>
          </label>
          <label for="rating3">
            <span>3</span>
            <span aria-hidden="true">☆☆☆</span>
            <input type="radio" id="rating3" name="rating" value="3" required>
          </label>
          <label for="rating4">
            <span>4</span>
            <span aria-hidden="true">☆☆☆☆</span>
            <input type="radio" id="rating4" name="rating" value="4" required>
          </label>
          <label for="rating5">
            <span>5</span>
            <span aria-hidden="true">☆☆☆☆☆</span>
            <input type="radio" id="rating5" name="rating" value="5" required>
          </label>
        </div>
      </fieldset>

      <label for="install-date">Fecha de instalación <span class="required">*</span></label>
      <input type="date" id="install-date" name="install-date" required>

      <fieldset>
        <legend>¿Qué características te resultaron útiles?</legend>
        <div class="checkbox-group">
          <label for="durability">
            <input type="checkbox" id="durability" name="features" value="durability">
            Durabilidad
          </label>
          <label for="ease-of-use">
            <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">
            Facilidad de uso
          </label>
          <label for="performance">
            <input type="checkbox" id="performance" name="features" value="performance">
            Rendimiento
          </label>
          <label for="design">
            <input type="checkbox" id="design" name="features" value="design">
            Diseño
          </label>
        </div>
      </fieldset>

      <label for="review">Reseña escrita</label>
      <textarea id="review" name="review" rows="5" placeholder="Comparte qué funcionó bien o qué podría mejorar."></textarea>

      <label for="username">Tu nombre</label>
      <input type="text" id="username" name="username" autocomplete="name">

      <input type="submit" value="Enviar reseña">
    </form>
  </main>

  <footer>
    <p>&copy;<span id="currentyear"></span> Jeniffer Carrillo, Ecuador</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
