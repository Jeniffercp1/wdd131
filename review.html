<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product review confirmation page with a completed review counter.">
  <meta name="author" content="Jeniffer Carrillo">
  <title>Review Confirmation | WDD 131</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <header>
    <span class="site-title">Product Review</span>
  </header>

  <main class="confirmation">

      <p>Your product review was submitted successfully.</p>

    </section>
  </main>

  <footer>
    <p>&copy;<span id="currentyear"></span> Jeniffer Carrillo, Ecuador</p>
    <p id="lastModified"></p>
  </footer>
