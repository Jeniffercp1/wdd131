<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pagina de confirmacion de resena de productos con contador de resenas completadas.">
  <meta name="author" content="Jeniffer Carrillo">
  <title>Confirmación de Reseña | WDD 131</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <span class="site-title">Reseña de Producto</span>
  </header>

  <main class="confirmation">
    <section class="message-panel">
      <h1>¡Gracias!</h1>
      <p>Tu reseña del producto se envió correctamente.</p>
      <p>Has completado <span id="review-count">0</span> reseña<span id="review-plural">s</span> de producto.</p>
      <a class="button-link" href="form.html">Enviar otra reseña</a>
    </section>
  </main>

  <footer>
    <p>&copy;<span id="currentyear"></span> Jeniffer Carrillo, Ecuador</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
